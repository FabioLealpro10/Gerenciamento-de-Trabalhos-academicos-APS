spring.application.name=Gerenciador Trabalhos

# Datasource: default H2 in-memory. Override with environment variables for MySQL
# Example MySQL URL: jdbc:mysql://db:3306/gerenciador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:gerenciador;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA/Hibernate (defaults; override via env vars)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-in-prod-please-123456789012345678901234567890}
jwt.expiration-ms=3600000

# H2 console frames
spring.security.headers.frame=false
