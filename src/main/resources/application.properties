spring.application.name=Gerenciador Trabalhos

# Datasource: default H2 in-memory. Override with environment variables for MySQL
# Example MySQL URL: jdbc:mysql://db:3306/gerenciador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:gerenciador;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA/Hibernate (defaults; override via env vars)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-in-prod-please-123456789012345678901234567890}
jwt.expiration-ms=3600000

# H2 console frames
spring.security.headers.frame=false

# Upload de PDF (armazenamento local)
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# E-mail (Gmail SMTP) — credenciais via variáveis de ambiente (arquivo .env)
# Veja CONFIGURACAO-EMAIL.md
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Recuperação de senha
app.recuperacao-senha.expiracao-minutos=5

# CORS (origens permitidas, separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5501,http://localhost:5501,http://localhost:4200,http://172.25.1.60:9904}
